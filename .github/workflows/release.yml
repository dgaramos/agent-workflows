name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run bin/check
        run: bin/check

      - name: Build tarball and checksum
        run: |
          TAG="${{ github.ref_name }}"
          TARBALL="agent-workflows-${TAG}.tar.gz"
          SHA256="agent-workflows-${TAG}.sha256"

          git archive \
            --format=tar.gz \
            --prefix="agent-workflows-${TAG}/" \
            "${TAG}" \
            -o "${TARBALL}"

          sha256sum "${TARBALL}" > "${SHA256}"

          echo "TARBALL=${TARBALL}" >> "${GITHUB_ENV}"
          echo "SHA256=${SHA256}"   >> "${GITHUB_ENV}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            "${TARBALL}" \
            "${SHA256}"
